<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🕵️ Friend Group FBI Database</title>

<style>

body{

}

.container{
max-width:800px;
margin:auto;
}

h1{
color:#00ff99;
}

input{

}

}

</head>

<body>

setTimeout(function(){

){

const vip = [

"👑 VIP FILE\n\nBeauty Score: 100%\nCompetence: 97%\nCoffee Dependency: 12%\n\nFinal Verdict:\nBuilt Different.",

vip[Math.floor(Math.random()*vip.length)];

dan[Math.floor(Math.random()*dan.length)];

"Opened fridge repeatedly without eating.",

"Started task 5 minutes before deadline.",

"Pretended Teams was loading.",

"Forgot why browser tab existed.",

"Opened email and immediately regretted it.",

"Survived meeting without paying attention.",

"Used coffee as emotional support.",

"Started side quest before finishing main task.",

"Opened Excel and lost motivation.",

"Left work chat unread for tactical reasons.",

"Checked fridge looking for new content.",

"Opened shopping app with no money.",

"Read same email six times.",

"Spent 20 minutes looking for phone while holding it.",

];

"Coffee Dependency: 98%\nBlood Type: Americano.",

"Coffee Dependency: 65%\nFunctional until 3AM.",

"📱 Full-Time Screenshot Collector",

"🏅 Shift Warrior",

"📂 FBI DATABASE FILE\n\n" +

</script>

</body>
</html>
